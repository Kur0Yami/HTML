<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat Mobile</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e6e6e6;
  }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header {
    padding: 12px 16px;
    background: #151922;
    border-bottom: 1px solid #232a36;
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 16px;
    font-size: 15px; line-height: 1.45; word-wrap: break-word;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end; background: #2563eb; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start; background: #1e2530; color: #e6e6e6;
    border-bottom-left-radius: 4px;
  }
  .bot.err { background: #3b1d1d; color: #fca5a5; }
  .typing { display: inline-block; }
  .typing::after {
    content: '▋'; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  footer {
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #151922; border-top: 1px solid #232a36;
    display: flex; gap: 8px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid #2a3342;
    background: #0f1115; color: #e6e6e6;
    border-radius: 12px; padding: 10px 12px;
    font-size: 16px; /* penting agar iOS tidak zoom */
    max-height: 120px; min-height: 44px; outline: none;
    font-family: inherit;
  }
  textarea:focus { border-color: #2563eb; }
  button {
    background: #2563eb; color: #fff; border: none;
    border-radius: 12px; padding: 0 16px; height: 44px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    flex-shrink: 0;
  }
  button:disabled { opacity: .5; }
  .keybar {
    padding: 8px 12px; background: #151922;
    border-top: 1px solid #232a36;
  }
  .keybar input {
    width: 100%; padding: 8px 10px; border-radius: 10px;
    border: 1px solid #2a3342; background: #0f1115;
    color: #e6e6e6; font-size: 14px; outline: none;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="dot"></span>
    <span>bn/claude-sonet-4-5-thinking</span>
  </header>

  <div id="chat"></div>

  <div class="keybar">
    <input id="apiKey" type="password" placeholder="API Key (Bearer token)" autocomplete="off">
  </div>

  <footer>
    <textarea id="input" rows="1" placeholder="Tulis pesan…"></textarea>
    <button id="send">Kirim</button>
  </footer>
</div>

<script>
  // Ganti kalau endpoint sebenarnya berbeda
  const API_URL = "https://routers.iyantama.tech/v1/chat/completions";
  const MODEL   = "bn/claude-sonet-4-5-thinking";

  const chatEl  = document.getElementById("chat");
  const inputEl = document.getElementById("input");
  const sendEl  = document.getElementById("send");
  const keyEl   = document.getElementById("apiKey");

  // simpan API key di localStorage
  keyEl.value = localStorage.getItem("apiKey") || "";
  keyEl.addEventListener("input", () => localStorage.setItem("apiKey", keyEl.value));

  // riwayat percakapan (format OpenAI)
  const messages = [];

  function addMsg(text, who, extraClass = "") {
    const div = document.createElement("div");
    div.className = "msg " + who + (extraClass ? " " + extraClass : "");
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }
  inputEl.addEventListener("input", autoGrow);

  // kirim saat Enter (tanpa Shift) di desktop; di mobile tetap tombol
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 768) {
      e.preventDefault();
      send();
    }
  });

  sendEl.addEventListener("click", send);

  async function send() {
    const text = inputEl.value.trim();
    const key  = keyEl.value.trim();

    if (!text) return;
    if (!key) { alert("Isi API Key dulu ya."); return; }

    addMsg(text, "user");
    messages.push({ role: "user", content: text });

    inputEl.value = "";
    autoGrow();
    sendEl.disabled = true;

    const botEl = addMsg("", "bot");
    const cursor = document.createElement("span");
    cursor.className = "typing";
    botEl.appendChild(cursor);

    let answer = "";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + key
        },
        body: JSON.stringify({
          model: MODEL,
          messages: messages,
          stream: true
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status} — ${errText.slice(0, 300)}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop(); // simpan baris terakhir yang mungkin belum lengkap

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith("data:")) continue;
          const data = trimmed.slice(5).trim();
          if (data === "[DONE]") continue;

          try {
            const json = JSON.parse(data);
            const delta =
              json.choices?.[0]?.delta?.content ??
              json.choices?.[0]?.message?.content ??
              "";
            if (delta) {
              answer += delta;
              botEl.textContent = answer;
              botEl.appendChild(cursor);
              chatEl.scrollTop = chatEl.scrollHeight;
            }
          } catch (_) { /* lewati chunk yang bukan JSON valid */ }
        }
      }

      cursor.remove();
      if (!answer) botEl.textContent = "(tidak ada respons)";
      messages.push({ role: "assistant", content: answer });

    } catch (err) {
      cursor.remove();
      botEl.classList.add("err");
      botEl.textContent = "Error: " + err.message;
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
